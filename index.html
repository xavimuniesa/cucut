<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rellotge de cucut · Xalet alpí</title>
<meta name="theme-color" content="#2b1a0e">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#1c120b}
body{font-family:"Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.wall{position:fixed;inset:0;transition:opacity 2.5s ease}
#wallDay{background:
  radial-gradient(110% 85% at 26% 6%, rgba(255,242,214,.7) 0%, rgba(255,242,214,0) 58%),
  radial-gradient(140% 110% at 50% 45%, rgba(0,0,0,0) 42%, rgba(58,34,14,.6) 100%),
  var(--n1), var(--n2), #e2d0b0}
#wallNight{opacity:0;background:
  radial-gradient(75% 55% at 20% 8%, rgba(255,170,86,.30), rgba(255,170,86,0) 70%),
  radial-gradient(60% 45% at 50% 42%, rgba(255,190,120,.10), rgba(255,190,120,0) 80%),
  radial-gradient(140% 110% at 50% 45%, rgba(0,0,0,0) 30%, rgba(0,0,0,.72) 100%),
  var(--n1), #2e261e}
body.night #wallNight{opacity:1}
#scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#clock{position:relative;height:min(96vh,192vw);width:min(48vh,96vw)}
@supports (height:1dvh){#clock{height:min(96dvh,192vw);width:min(48dvh,96vw)}}
#clock>svg,#clock>img{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;display:block}
.lay{transition:filter 2.5s}
body.night .lay{filter:brightness(.6) saturate(.85)}
#sGlow{opacity:0;transition:opacity 2.5s}
body.night #sGlow{opacity:1}
.hit{pointer-events:all;cursor:pointer}

#ui{position:fixed;left:50%;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;
  background:rgba(34,20,10,.62);box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,230,190,.12);z-index:10}
#ui button{appearance:none;border:0;background:transparent;color:#f4e7cc;font:inherit;font-size:14px;padding:8px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
#ui button:hover{background:rgba(255,235,200,.12)}
#ui button.on{background:rgba(226,180,100,.28)}
#ui .ic{font-size:16px;line-height:1}
@media (max-width:640px){#ui .lb{display:none}#ui button{padding:9px 11px}}
#hint{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:10;padding:8px 16px;border-radius:999px;
  background:rgba(34,20,10,.66);color:#f4e7cc;font-size:14px;transition:opacity 1s;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
#hint.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="wall" id="wallDay"></div>
<div class="wall" id="wallNight"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs id="defs0">
  <!-- fusta -->
  <linearGradient id="gLog" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2e1b0c"/><stop offset=".14" stop-color="#8f5d33"/><stop offset=".45" stop-color="#6f4627"/><stop offset=".85" stop-color="#4a2d17"/><stop offset="1" stop-color="#24150a"/>
  </linearGradient>
  <radialGradient id="gEnd" cx=".42" cy=".38" r=".7"><stop offset="0" stop-color="#cf9e66"/><stop offset=".6" stop-color="#9c6b3d"/><stop offset="1" stop-color="#583618"/></radialGradient>
  <linearGradient id="gCarve" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b98249"/><stop offset="1" stop-color="#7b4e28"/></linearGradient>
  <linearGradient id="gCarveDk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8e5d32"/><stop offset="1" stop-color="#553418"/></linearGradient>
  <radialGradient id="gDial" cx=".42" cy=".36" r=".7"><stop offset="0" stop-color="#704829"/><stop offset=".7" stop-color="#462b16"/><stop offset="1" stop-color="#2b190b"/></radialGradient>
  <linearGradient id="gIvory" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9e8"/><stop offset="1" stop-color="#dcc79c"/></linearGradient>
  <linearGradient id="gGlass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9c0c8"/><stop offset=".42" stop-color="#445b64"/><stop offset="1" stop-color="#18252b"/></linearGradient>
  <linearGradient id="gStage" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#150b05"/><stop offset="1" stop-color="#3b2311"/></linearGradient>
  <linearGradient id="gShadeTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".6"/><stop offset=".55" stop-color="#000" stop-opacity="0"/></linearGradient>
  <linearGradient id="gPlatform" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a06a39"/><stop offset="1" stop-color="#5c3819"/></linearGradient>
  <linearGradient id="gWater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fc0d4"/><stop offset="1" stop-color="#2d5b6e"/></linearGradient>
  <linearGradient id="gIron" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#34302c"/><stop offset=".28" stop-color="#77705f"/><stop offset=".55" stop-color="#34302b"/><stop offset="1" stop-color="#0f0e0d"/></linearGradient>
  <linearGradient id="gBrass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6d5016"/><stop offset=".35" stop-color="#f1d68a"/><stop offset=".62" stop-color="#b38833"/><stop offset="1" stop-color="#5a4112"/></linearGradient>
  <radialGradient id="gLeaf" cx=".35" cy=".28" r=".85"><stop offset="0" stop-color="#cf975a"/><stop offset=".55" stop-color="#8d5c30"/><stop offset="1" stop-color="#4c2d13"/></radialGradient>
  <radialGradient id="gBird" cx=".4" cy=".3" r=".8"><stop offset="0" stop-color="#8a8279"/><stop offset="1" stop-color="#4c453f"/></radialGradient>
  <radialGradient id="gGlowWin"><stop offset="0" stop-color="#ffc977" stop-opacity=".75"/><stop offset=".5" stop-color="#ff9f45" stop-opacity=".22"/><stop offset="1" stop-color="#ff8a30" stop-opacity="0"/></radialGradient>
  <linearGradient id="gLit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe2a6"/><stop offset="1" stop-color="#f09a3c"/></linearGradient>

  <clipPath id="cGable"><polygon points="300,150 64,366 536,366"/></clipPath>
  <clipPath id="cShingle"><rect x="-12" y="3" width="380" height="37"/></clipPath>
  <clipPath id="cStage"><path d="M176,772 V716 Q176,692 200,692 H400 Q424,692 424,716 V772 Z"/></clipPath>
  <clipPath id="cWall"><rect x="100" y="360" width="400" height="412"/></clipPath>

  <!-- veta de la fusta -->
  <filter id="grainH" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="1200" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.011 0.34" numOctaves="3" seed="3" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1" result="g"/>
    <feComposite in="SourceGraphic" in2="g" operator="arithmetic" k1="0.95" k2="0.6" k3="0" k4="0" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="grainV" filterUnits="userSpaceOnUse" x="0" y="0" width="600" height="1200" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.36 0.012" numOctaves="3" seed="9" result="n"/>
    <feColorMatrix in="n" type="matrix" values=".33 .33 .33 0 0  .33 .33 .33 0 0  .33 .33 .33 0 0  0 0 0 0 1" result="g"/>
    <feComposite in="SourceGraphic" in2="g" operator="arithmetic" k1="0.95" k2="0.6" k3="0" k4="0" result="m"/>
    <feComposite in="m" in2="SourceGraphic" operator="in"/>
  </filter>
  <!-- relleu tallat -->
  <filter id="bevel" x="-8%" y="-8%" width="118%" height="122%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.4" result="b"/>
    <feDiffuseLighting in="b" surfaceScale="2.6" diffuseConstant="1" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="48"/></feDiffuseLighting>
    <feSpecularLighting in="b" surfaceScale="2.6" specularConstant=".5" specularExponent="16" lighting-color="#ffe6bf" result="s"><feDistantLight azimuth="235" elevation="48"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.3" result="l"/>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="l" in2="s2" operator="arithmetic" k2="1" k3=".55" result="ls"/>
    <feComposite in="ls" in2="SourceAlpha" operator="in" result="obj"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.2" result="sb"/>
    <feOffset in="sb" dx="2.5" dy="3.5" result="so"/>
    <feColorMatrix in="so" type="matrix" values="0 0 0 0 .07  0 0 0 0 .04  0 0 0 0 .02  0 0 0 .62 0" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="obj"/></feMerge>
  </filter>
  <filter id="bevelDeep" x="-10%" y="-10%" width="125%" height="128%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="2.1" result="b"/>
    <feDiffuseLighting in="b" surfaceScale="4" diffuseConstant="1" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="45"/></feDiffuseLighting>
    <feSpecularLighting in="b" surfaceScale="4" specularConstant=".6" specularExponent="18" lighting-color="#ffe6bf" result="s"><feDistantLight azimuth="235" elevation="45"/></feSpecularLighting>
    <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.35" result="l"/>
    <feComposite in="s" in2="SourceAlpha" operator="in" result="s2"/>
    <feComposite in="l" in2="s2" operator="arithmetic" k2="1" k3=".6" result="ls"/>
    <feComposite in="ls" in2="SourceAlpha" operator="in" result="obj"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.4" result="sb"/>
    <feOffset in="sb" dx="4" dy="5.5" result="so"/>
    <feColorMatrix in="so" type="matrix" values="0 0 0 0 .06  0 0 0 0 .03  0 0 0 0 .01  0 0 0 .7 0" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="obj"/></feMerge>
  </filter>
  <filter id="bevelSm" x="-10%" y="-10%" width="125%" height="130%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation=".7" result="b"/>
    <feDiffuseLighting in="b" surfaceScale="1.6" diffuseConstant="1" lighting-color="#fff" result="d"><feDistantLight azimuth="235" elevation="50"/></feDiffuseLighting>
    <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.28" result="l"/>
    <feComposite in="l" in2="SourceAlpha" operator="in" result="obj"/>
    <feGaussianBlur in="SourceAlpha" stdDeviation=".9" result="sb"/>
    <feOffset in="sb" dx="1.2" dy="1.8" result="so"/>
    <feColorMatrix in="so" type="matrix" values="0 0 0 0 .05  0 0 0 0 .03  0 0 0 0 .01  0 0 0 .7 0" result="sh"/>
    <feMerge><feMergeNode in="sh"/><feMergeNode in="obj"/></feMerge>
  </filter>
  <filter id="dropSm" x="-20%" y="-20%" width="150%" height="150%">
    <feDropShadow dx="2.4" dy="3.6" stdDeviation="1.6" flood-color="#120903" flood-opacity=".6"/>
  </filter>
  <filter id="blurGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="soft14" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  <radialGradient id="gBirdHead" cx=".42" cy=".32" r=".75"><stop offset="0" stop-color="#a39b93"/><stop offset="1" stop-color="#554d46"/></radialGradient>
</defs>
</svg>

<div id="scene">
  <div id="clock">
    <svg id="sBack"  class="lay" viewBox="0 0 600 1200" aria-hidden="true"></svg>
    <svg id="sBody"  class="lay" viewBox="0 0 600 1200" role="img" aria-label="Rellotge de cucut en forma de xalet alpí"></svg>
    <svg id="sFront" class="lay" viewBox="0 0 600 1200" aria-hidden="true"></svg>
    <svg id="sGlow"  viewBox="0 0 600 1200" aria-hidden="true"></svg>
  </div>
</div>

<div id="hint">🔔 Toca per activar el so · 🐦 fa cantar el cucut</div>
<div id="ui">
  <button id="bSound" aria-label="So"><span class="ic">🔇</span><span class="lb">So</span></button>
  <button id="bTick" class="on" aria-label="Tic-tac"><span class="ic">⏱️</span><span class="lb">Tic-tac</span></button>
  <button id="bCuckoo" aria-label="Fes cantar el cucut"><span class="ic">🐦</span><span class="lb">Cucut!</span></button>
  <button id="bLight" aria-label="Llum"><span class="ic">🌗</span><span class="lb">Auto</span></button>
  <button id="bQuiet" aria-label="Nit silenciosa"><span class="ic">🤫</span><span class="lb">Nit silenciosa</span></button>
</div>

<script>
(()=>{
'use strict';
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
function el(t,a,p){const e=document.createElementNS(NS,t);if(a)for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
let seed=11;const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646};
const TAU=Math.PI*2, D2R=Math.PI/180;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- textura de la paret ---------- */
const svgUrl=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
const n1=`<svg xmlns='http://www.w3.org/2000/svg' width='256' height='256'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .32 0 0 0 0 .22 0 0 0 0 .12 0 0 0 .26 0'/></filter><rect width='100%' height='100%' filter='url(#f)'/></svg>`;
const n2=`<svg xmlns='http://www.w3.org/2000/svg' width='900' height='900'><filter id='f'><feTurbulence type='fractalNoise' baseFrequency='.006' numOctaves='4' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35 0 0 0 0 .24 0 0 0 0 .12 .9 0 0 0 -.34'/></filter><rect width='100%' height='100%' filter='url(#f)'/></svg>`;
document.documentElement.style.setProperty('--n1',svgUrl(n1));
document.documentElement.style.setProperty('--n2',svgUrl(n2));

const DEF=$('defs0'), K=$('sBack'), B=$('sBody'), F=$('sFront'), G=$('sGlow');
const CX=300, CY=476; // centre de l'esfera

/* =====================================================
   COS DEL RELLOTGE (estàtic, amb relleu)
   ===================================================== */
{const sh=el('g',{},B);
  el('polygon',{points:'300,62 585,368 500,368 500,812 100,812 100,368 15,368',fill:'#2a1608',opacity:.36,filter:'url(#soft14)',transform:'translate(14 20)'},sh);
  el('rect',{x:50,y:588,width:500,height:92,fill:'#2a1608',opacity:.26,filter:'url(#soft14)',transform:'translate(18 26)'},sh);
  el('path',{d:'M30,768 H570 V812 L540,845 H60 L30,812 Z',fill:'#2a1608',opacity:.38,filter:'url(#soft14)',transform:'translate(20 28)'},sh);}

/* --- frontó (gable) amb taulons verticals i pintura tirolesa --- */
{
  const g=el('g',{},B);
  const bd=el('g',{'clip-path':'url(#cGable)',filter:'url(#grainV)'},g);
  for(let i=0,x=60;x<540;x+=22,i++){
    el('rect',{x,y:140,width:22,height:230,fill:i%2?'#6b4324':'#613c1f'},bd);
    el('rect',{x:x+21,y:140,width:1.5,height:230,fill:'#2b170a',opacity:.75},bd);
  }
  el('polygon',{points:'300,150 64,366 536,366',fill:'url(#gShadeTop)'},g);

  // Lüftlmalerei: flors pintades a mà
  const paint=el('g',{opacity:.9},g);
  const edel=(x,y,s)=>{const f=el('g',{transform:`translate(${x} ${y}) scale(${s})`},paint);
    for(let k=0;k<8;k++) el('ellipse',{cx:0,cy:-4.2,rx:1.7,ry:4.2,fill:'#f3eee0',transform:`rotate(${k*45})`},f);
    for(let k=0;k<5;k++) el('circle',{cx:Math.cos(k*1.26)*1.4,cy:Math.sin(k*1.26)*1.4,r:.9,fill:'#e2bf45'},f);};
  const tulip=(x,y,s,c)=>{const f=el('g',{transform:`translate(${x} ${y}) scale(${s})`},paint);
    el('path',{d:'M-4,-2 Q-5,-9 -2.5,-11 L0,-7 L2.5,-11 Q5,-9 4,-2 Q0,1 -4,-2 Z',fill:c},f);};
  for(const sx of [-1,1]){
    const bx=300+sx*62;
    el('path',{d:`M${bx},338 C${bx-sx*4},322 ${bx+sx*6},306 ${bx},290 M${bx},322 C${bx+sx*10},318 ${bx+sx*16},310 ${bx+sx*18},300 M${bx},314 C${bx-sx*10},310 ${bx-sx*14},302 ${bx-sx*15},294`,stroke:'#4d6b39','stroke-width':1.6,fill:'none'},paint);
    for(const [dx,dy] of [[6,316],[-7,324],[12,330]]) el('ellipse',{cx:bx+sx*dx,cy:dy,rx:2,ry:5,fill:'#58783f',transform:`rotate(${sx*dx*4} ${bx+sx*dx} ${dy})`},paint);
    edel(bx,288,1.15); tulip(bx+sx*18,300,1,'#b3302a'); tulip(bx-sx*15,294,.9,'#2f5d8a');
    for(let k=0;k<5;k++) el('circle',{cx:bx+sx*(22+k*5),cy:340-k*9,r:1.3,fill:'#c43a2c'},paint);
  }
  // porteta del cucut: marc tallat
  const df=el('g',{filter:'url(#bevelDeep)'},g);
  el('path',{d:'M274,322 V262 A26,26 0 0 1 326,262 V322',fill:'none',stroke:'url(#gCarve)','stroke-width':11},df);
  el('rect',{x:260,y:317,width:80,height:9,rx:2,fill:'url(#gCarve)'},df);
  el('path',{d:'M266,326 h12 l-6,16 z M322,326 h12 l-6,16 z',fill:'url(#gCarveDk)'},df);
  el('path',{d:'M293,236 L300,226 L307,236 Z',fill:'url(#gCarve)'},df);
  el('path',{d:'M274,318 V262 A26,26 0 0 1 326,262 V318 Z',fill:'#0d0602'},g);
  el('path',{d:'M274,318 V262 A26,26 0 0 1 326,262 V318 Z',fill:'url(#gShadeTop)',opacity:.6},g);
}

/* --- paret de troncs (Strickbau) --- */
{
  const w=el('g',{filter:'url(#grainH)','clip-path':'url(#cWall)'},B);
  for(let y=360;y<790;y+=26) el('rect',{x:115,y,width:370,height:26,fill:'url(#gLog)'},w);
  const ends=el('g',{filter:'url(#bevel)'},B);
  for(let k=0,y=360;y<770;y+=26,k++){
    if(k%2) continue;
    for(const x of [101,471]){
      el('rect',{x,y:y+1,width:28,height:24,rx:11,fill:'url(#gEnd)'},ends);
      for(const r of [3.5,7,10]) el('ellipse',{cx:x+14,cy:y+13,rx:r*1.05,ry:r*.9,fill:'none',stroke:'#5e3a1a','stroke-width':.8,opacity:.55},ends);
    }
  }
}

/* --- finestres amb geranis --- */
function windowAt(cx){
  const gb=el('g',{filter:'url(#bevel)'},B);
  el('path',{d:`M${cx-27},431 L${cx},413 L${cx+27},431 Z`,fill:'url(#gCarve)'},gb);
  el('circle',{cx,cy:424,r:3,fill:'#6d4322'},gb);
  el('rect',{x:cx-21,y:430,width:42,height:67,rx:1.5,fill:'url(#gCarve)'},gb);
  const g=el('g',{},B);
  el('rect',{x:cx-16,y:435,width:32,height:57,fill:'url(#gGlass)'},g);
  el('path',{d:`M${cx-16},435 h12 q-4,10 -12,14 z M${cx+16},435 h-12 q4,10 12,14 z`,fill:'#efe8da',opacity:.85},g); // cortina de puntes
  el('path',{d:`M${cx-12},490 L${cx+6},440`,stroke:'#fff',opacity:.18,'stroke-width':5},g);
  el('rect',{x:cx-1.5,y:435,width:3,height:57,fill:'#6b4424'},g);
  el('rect',{x:cx-16,y:461,width:32,height:3,fill:'#6b4424'},g);
  const box=el('g',{filter:'url(#bevel)'},B);
  el('rect',{x:cx-27,y:497,width:54,height:15,rx:1.5,fill:'url(#gCarveDk)'},box);
  el('path',{d:`M${cx-4},501 q-3,-3 -5,0 q0,3 5,7 q5,-4 5,-7 q-2,-3 -5,0z`,fill:'#3a220f'},box);
  const fl=el('g',{},B);
  for(let i=0;i<9;i++){const x=cx-24+i*6+rnd()*2, y=493+rnd()*4;
    el('ellipse',{cx:x,cy:y+3,rx:4.4,ry:3,fill:rnd()>.5?'#3f6b2f':'#4d7a36'},fl);}
  for(let i=0;i<4;i++) el('path',{d:`M${cx-22+i*14},511 q${-2+rnd()*4},8 ${-3+rnd()*6},15`,stroke:'#46732f','stroke-width':2.4,fill:'none','stroke-linecap':'round'},fl);
  for(let i=0;i<6;i++){const x=cx-20+i*8+rnd()*3, y=487+rnd()*6;
    for(let k=0;k<5;k++) el('circle',{cx:x+Math.cos(k*1.26)*2.3,cy:y+Math.sin(k*1.26)*2.3,r:1.9,fill:k%2?'#d23a2d':'#b8261f'},fl);
    el('circle',{cx:x,cy:y,r:1,fill:'#f2c9a0'},fl);}
}
windowAt(157); windowAt(443);

/* --- esfera amb corona de fulles --- */
{
  const D=el('g',{},B);
  el('circle',{cx:CX,cy:CY,r:118,fill:'#1d1007',opacity:.45},D);

const A={ctx:null,on:false,tick:true};
function makeNoise(ctx,sec){const b=ctx.createBuffer(1,ctx.sampleRate*sec,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function makeIR(ctx,sec){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,3.2)}return b}
function initAudio(){
  if(A.ctx){A.ctx.resume();return}
  const C=window.AudioContext||window.webkitAudioContext; if(!C) return;
  const ctx=A.ctx=new C();
  A.master=ctx.createGain(); A.master.gain.value=A.on?.9:0;
  const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=3;
  const conv=ctx.createConvolver(); conv.buffer=makeIR(ctx,1.8);
  const wet=ctx.createGain(); wet.gain.value=.24;
  A.master.connect(comp); comp.connect(ctx.destination);
  A.master.connect(conv); conv.connect(wet); wet.connect(ctx.destination);
  A.noise=makeNoise(ctx,2);
  A.tickBus=ctx.createGain(); A.tickBus.gain.value=A.tick?.55:0; A.tickBus.connect(A.master);
}
function env(g,t,peak,att,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+att);g.gain.exponentialRampToValueAtTime(.0001,t+att+dec)}
function noiseHit(t,type,freq,q,peak,dec,dest){
  const c=A.ctx,s=c.createBufferSource();s.buffer=A.noise;
  const f=c.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;
  const g=c.createGain();env(g,t,peak,.002,dec);
  s.connect(f);f.connect(g);g.connect(dest||A.master);s.start(t,Math.random()*1.5,dec+.05);
}
function sfxTick(alt){
  if(!A.ctx||!A.on||!A.tick) return;
  const c=A.ctx,t=c.currentTime+.005;
  noiseHit(t,'bandpass',alt?2500:1850,7,.5,.045,A.tickBus);
  const o=c.createOscillator(),g=c.createGain();o.frequency.value=alt?520:430;env(g,t,.12,.002,.035);o.connect(g);g.connect(A.tickBus);o.start(t);o.stop(t+.06);
}
function sfxClick(){
  if(!A.ctx||!A.on) return;
  const t=A.ctx.currentTime+.005;
  noiseHit(t,'highpass',2800,1,.25,.03);
  noiseHit(t,'lowpass',400,1,.3,.06);
}
function pipe(f,t,dur){
  const c=A.ctx;
  const o=c.createOscillator();o.type='triangle';o.frequency.setValueAtTime(f*1.012,t);o.frequency.exponentialRampToValueAtTime(f,t+.06);
  const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f*2;
  const g2=c.createGain();g2.gain.value=.18;
  const lp=c.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;
  const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.42,t+.03);g.gain.setValueAtTime(.42,t+dur*.55);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);g.connect(A.master);
  o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);
  const s=c.createBufferSource();s.buffer=A.noise;const bp=c.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=14;
  const gn=c.createGain();gn.gain.setValueAtTime(.0001,t);gn.gain.exponentialRampToValueAtTime(.9,t+.03);gn.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(bp);bp.connect(gn);gn.connect(A.master);s.start(t,Math.random(),dur+.1);
}
function sfxCuckoo(){
  if(!A.ctx||!A.on) return;
  const t=A.ctx.currentTime+.02;
  noiseHit(t-.01,'lowpass',500,.7,.18,.14);
  pipe(622,t,.26);

function sfxRatchet(){

function sfxKnock(){

  const c=A.ctx,t=c.currentTime+.005;

// cant del gall (sintetitzat): ki-ki-ri-kiii
function sfxCrow(){
  if(!A.ctx||!A.on) return;
  const c=A.ctx, t0=c.currentTime+.02;
  const out=c.createGain(); out.gain.value=.16; out.connect(A.master);
  const f1=c.createBiquadFilter(); f1.type='bandpass'; f1.frequency.value=1500; f1.Q.value=1.6; f1.connect(out);
  const f2=c.createBiquadFilter(); f2.type='bandpass'; f2.frequency.value=2900; f2.Q.value=2.5;
  const g2=c.createGain(); g2.gain.value=.5; f2.connect(g2); g2.connect(out);
  const syl=[[0,.1,700,780],[.13,.1,740,820],[.28,.15,800,960],[.47,.7,960,700]];
  for(const [st,dur,fa,fb] of syl){
    const t=t0+st, o=c.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(fa,t);
    if(dur>.5){o.frequency.linearRampToValueAtTime(1080,t+.12);o.frequency.linearRampToValueAtTime(fb,t+dur)}

    const g=c.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(1,t+.025);
    g.gain.setValueAtTime(1,t+dur*.7); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g); g.connect(f1); g.connect(f2);
    o.start(t); lfo.start(t); o.stop(t+dur+.05); lfo.stop(t+dur+.05);
  }
}
// Ländler original per a caixa de música
const MEL=[[[79,1],[83,1],[86,1]],[[91,2],[86,1]],[[90,1],[88,1],[84,1]],[[83,2],[79,1]],
           [[88,1],[84,1],[88,1]],[[86,2],[83,1]],[[84,1],[83,1],[81,1]],[[86,2],[84,1]],
           [[83,1],[86,1],[91,1]],[[95,2],[91,1]],[[93,1],[91,1],[88,1]],[[91,2],[86,1]],
           [[88,1],[84,1],[81,1]],[[83,1],[86,1],[91,1]],[[88,1],[86,1],[90,1]],[[91,3]]];
const CH='G G D7 G C G D7 D G G C G C G D7 G'.split(' ');
const CHORD={G:[55,71,74],D7:[50,69,72],C:[48,72,76],D:[50,69,78]};
const BEAT=.34, MUSIC_DUR=MEL.length*3*BEAT+1.6;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function mbox(m,t,v){
  const c=A.ctx,f=mtof(m);
  const g=c.createGain();env(g,t,v,.004,1.7);g.connect(A.master);
  const o=c.createOscillator();o.type='sine';o.frequency.value=f;o.connect(g);
  const g2=c.createGain();env(g2,t,v*.35,.003,.35);g2.connect(A.master);
  const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f*3.01;o2.connect(g2);
  const g3=c.createGain();env(g3,t,v*.12,.002,.12);g3.connect(A.master);
  const o3=c.createOscillator();o3.type='sine';o3.frequency.value=f*5.43;o3.connect(g3);
  for(const x of [o,o2,o3]){x.start(t);x.stop(t+1.9)}
}
function sfxMusic(){
  if(!A.ctx||!A.on) return;
  const t0=A.ctx.currentTime+.1;
  MEL.forEach((bar,b)=>{
    const tb=t0+b*3*BEAT; let beat=0;
    for(const [m,len] of bar){mbox(m,tb+beat*BEAT+Math.random()*.012,.16);beat+=len}
    const ch=CHORD[CH[b]];
    mbox(ch[0],tb,.13);
    if(b<MEL.length-1){mbox(ch[1],tb+BEAT,.06);mbox(ch[2],tb+BEAT,.06);mbox(ch[1],tb+2*BEAT,.06);mbox(ch[2],tb+2*BEAT,.06)}
    else{mbox(ch[1],tb+.05,.07);mbox(ch[2],tb+.1,.07);mbox(79,tb+.15,.06)}
  });
}

const BEATS=MEL.length*3, MUSIC_T=BEATS*BEAT;
const S={door:0,bird:0,bow:0,wing:0,beak:0,phi0:0,mt:-1,musicAt:0};
const tweens=[];
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t)};
const eio=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const eOut=t=>1-Math.pow(1-t,3);
const eBack=t=>{const c1=1.7,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
function tw(o,k,to,ms,ease=eio){return new Promise(res=>{
  for(let i=tweens.length-1;i>=0;i--) if(tweens[i].o===o&&tweens[i].k===k){tweens[i].res();tweens.splice(i,1)}
  tweens.push({o,k,from:o[k],to,t0:performance.now(),ms,ease,res});
})}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

const R={cr:0,beak:0,flap:0,nod:0};
let crowing=false;
async function crow(){
  if(crowing) return; crowing=true;
  for(let i=0;i<2;i++){ await tw(R,'flap',1,110,eOut); await tw(R,'flap',0,130); }
  tw(R,'cr',1,320,eOut); await wait(260);
  sfxCrow();
  tw(R,'beak',1,120); await wait(1000);
  tw(R,'beak',0,180); tw(R,'cr',0,420); await wait(450);
  crowing=false;
}
let busy=false;
async function call(){
  sfxCuckoo();
  tw(S,'bow',1,170,eOut);tw(S,'wing',1,170,eOut);tw(S,'beak',1,110);
  await wait(250); tw(S,'beak',.15,90);
  await wait(110); tw(S,'beak',1,100); tw(S,'wing',.55,120);
  await wait(330);
  tw(S,'bow',0,340);tw(S,'beak',0,160);tw(S,'wing',0,340);
  await wait(560);
}

  if(busy) return; busy=true;

async function wind(w){
  if(w.winding||w.d<2) return; w.winding=true;
  const iv=setInterval(sfxRatchet,70);
  await tw(w,'d',0,Math.max(500,w.d*8),eio);
  clearInterval(iv); w.winding=false;
}
{
  const now=new Date(); const hrs=((now.getHours()+now.getMinutes()/60)-8+24)%24;
  weights[0].d=clamp(hrs/26*240,0,240);

// dia / nit segons la posta de sol (Barcelona)
function sunTimes(date,lat=41.49,lon=2.13){
  const JD=date.getTime()/864e5+2440587.5;
  const n=Math.round(JD-2451545+.0008), Js=n-lon/360;
  const M=(357.5291+.98560028*Js)%360, Mr=M*D2R;
  const C=1.9148*Math.sin(Mr)+.02*Math.sin(2*Mr)+.0003*Math.sin(3*Mr);
  const L=((M+C+180+102.9372)%360)*D2R;
  const Jt=2451545+Js+.0053*Math.sin(Mr)-.0069*Math.sin(2*L);
  const dec=Math.asin(Math.sin(L)*Math.sin(23.44*D2R));
  const cw=(Math.sin(-.83*D2R)-Math.sin(lat*D2R)*Math.sin(dec))/(Math.cos(lat*D2R)*Math.cos(dec));
  const w=Math.acos(clamp(cw,-1,1))/D2R;
  const toMs=J=>(J-2440587.5)*864e5;
  return {rise:toMs(Jt-w/360),set:toMs(Jt+w/360)};
}
let lightMode='auto';
function isNightNow(){
  if(lightMode!=='auto') return lightMode==='night';
  const now=new Date(), s=sunTimes(now), t=now.getTime();
  return t<s.rise-15*6e4||t>s.set+25*6e4;
}
function applyLight(){document.body.classList.toggle('night',isNightNow())}
applyLight(); setInterval(applyLight,60000);

// moviment mecànic dels ballarins
function keys(p,ks){
  for(let i=1;i<ks.length;i++){ if(p<=ks[i][0]){const [a,va]=ks[i-1],[b,vb]=ks[i];return va+(vb-va)*sstep((p-a)/(b-a))} }
  return ks[ks.length-1][1];
}
const rot=(p,a)=>`rotate(${a.toFixed(1)} ${p.px} ${p.py})`;
function poseCouple(c,b,A,spinVel){
  const p=b%3;
  const mArmO=A*keys(p,[[0,-18],[.35,-18],[.9,155],[2.3,155],[2.8,-18],[3,-18]]);
  const mLegL=A*keys(p,[[0,0],[.2,24],[.55,0],[3,0]]);
  const mLegR=A*keys(p,[[0,0],[1.5,0],[1.72,-24],[2.1,0],[3,0]]);
  const held=A*150;
  const wArmO=A*keys(p,[[0,0],[1,0],[1.35,-115],[2.5,-115],[2.9,0],[3,0]]);
  const head=A*7*Math.sin(Math.PI*b);
  const flare=1+.3*clamp(spinVel,0,1)*A;
  const sway=A*5*Math.sin(Math.PI*b+.6);
  const P=c.parts[c.side==='b'?1:0];
  P.mArmO.g.setAttribute('transform',rot(P.mArmO,mArmO));
  P.mArmI.g.setAttribute('transform',rot(P.mArmI,-held));
  P.wArmI.g.setAttribute('transform',rot(P.wArmI,held));
  P.wArmO.g.setAttribute('transform',rot(P.wArmO,wArmO));
  P.mLegL.g.setAttribute('transform',`translate(0 ${(-mLegL/10).toFixed(2)}) `+rot(P.mLegL,mLegL));
  P.mLegR.g.setAttribute('transform',`translate(0 ${(mLegR/10).toFixed(2)}) `+rot(P.mLegR,mLegR));
  P.mHead.g.setAttribute('transform',rot(P.mHead,head));
  P.wHead.g.setAttribute('transform',rot(P.wHead,-head));
  P.skirt.g.setAttribute('transform',`translate(${P.skirt.px} ${P.skirt.py}) rotate(${sway.toFixed(1)}) scale(${flare.toFixed(3)} 1) translate(${-P.skirt.px} ${-P.skirt.py})`);
}

// bucle principal
let tickN=0, lastMin=-1;
const T=1.3; let lastSign=0, alt=false, lastKey='', lastTf=0, lastTS=performance.now(), lastChop=-1, wheelA=0, posed=false;
const cache=new Map();
const set=(node,attr,val)=>{let m=cache.get(node); if(!m){m={};cache.set(node,m)} if(m[attr]!==val){m[attr]=val;node.setAttribute(attr,val)}};

function frame(ts){
  const dt=Math.min(.1,(ts-lastTS)/1000); lastTS=ts;
  for(let i=tweens.length-1;i>=0;i--){const w=tweens[i],p=Math.min(1,(ts-w.t0)/w.ms);w.o[w.k]=w.from+(w.to-w.from)*w.ease(p);if(p>=1){w.res();tweens.splice(i,1)}}
  const now=new Date(), sec=now.getSeconds()+now.getMilliseconds()/1000, min=now.getMinutes()+sec/60, hr=(now.getHours()%12)+min/60;

  // agulles
  const aM=(min*6).toFixed(2), aH=(hr*30).toFixed(2);
  set(minH,'transform',`translate(${CX} ${CY}) rotate(${aM})`);
  set(hourH,'transform',`translate(${CX} ${CY}) rotate(${aH})`);
  set(minS,'transform',`translate(${CX+3} ${CY+4}) rotate(${aM})`);
  set(hourS,'transform',`translate(${CX+3} ${CY+4}) rotate(${aH})`);

  // pèndol i tic-tac
  const ph=(ts/1000)%T/T*TAU, pa=(5.5*Math.sin(ph)).toFixed(2);
  set(pend,'transform',`rotate(${pa} 300 700)`);
  set(pendSh,'transform',`translate(7 10) rotate(${pa} 300 700)`);
  const sg=Math.cos(ph)>=0?1:-1;
  if(sg!==lastSign){if(lastSign!==0){alt=!alt;sfxTick(alt);tickN++;if(tickN%4===0&&!crowing){tw(R,'nod',-10,120).then(()=>tw(R,'nod',0,220))}}lastSign=sg}

  // pinyes
  const w0=weights[0]; if(!w0.winding) w0.d=Math.min(240,w0.d+dt/(26*3600)*240);
  for(const w of weights){
    const d=Math.round(w.d*10)/10; if(d===w.drawn) continue; w.drawn=d;
    const y=842+d;
    for(const l of w.chain) l.setAttribute('y2',y);
    w.chain[0].setAttribute('stroke-dashoffset',-d); w.chain[1].setAttribute('stroke-dashoffset',-.7-d); w.chain[2].setAttribute('stroke-dashoffset',-4.4-d);
    const ly=838+(240-d)*.9;
    for(const l of w.loose) l.setAttribute('y2',ly);
    w.loose[0].setAttribute('stroke-dashoffset',d); w.loose[1].setAttribute('stroke-dashoffset',-.7+d); w.loose[2].setAttribute('stroke-dashoffset',-4.4+d);
    w.ring.setAttribute('cy',ly+5);
    w.cone.setAttribute('transform',`translate(${w.x} ${y-2})`);
    w.sc.setAttribute('transform',`translate(${w.x+8} ${y+10})`);
  }

  // portetes
  for(const lf of [doorL,doorR]){
    const sx=1-1.34*S.door;
    set(lf.g,'transform',`translate(${lf.hx} 0) scale(${sx.toFixed(3)} 1) translate(${-lf.hx} 0)`);
    set(lf.shade,'opacity',(clamp(-sx,0,1)*.45+clamp(S.door,0,1)*.12).toFixed(2));
  }
  // cucut frontal: surt de la porta i s'acosta
  const p=S.bird;
  set(bird,'opacity',clamp(p*3,0,1).toFixed(2));
  set(bird,'transform',`translate(300 ${(316+6*p).toFixed(2)}) scale(${(.72+.5*p).toFixed(3)})`);
  const bw=S.bow;
  set(BP.body,'transform',`scale(1 ${(1-.08*bw).toFixed(3)})`);
  set(BP.head,'transform',`translate(0 ${(-40+5*bw).toFixed(2)}) scale(${(1+.08*bw).toFixed(3)})`);
  set(BP.tail,'transform',`translate(0 ${(-5*bw).toFixed(2)})`);
  set(BP.wL,'transform',`rotate(${(32*S.wing).toFixed(1)} -9 -32)`);
  set(BP.wR,'transform',`rotate(${(-32*S.wing).toFixed(1)} 9 -32)`);
  set(BP.beakU,'transform',`translate(0 ${(-1.2*S.beak).toFixed(2)})`);
  set(BP.beakL,'transform',`translate(0 ${(3.2*S.beak).toFixed(2)})`);

  // pagès llaurant (va i ve pel camp mentre sona la música)
  let b=0, amp=0;
  if(S.mt>=0){
    S.mt=clamp((ts-S.musicAt)/1000,0,MUSIC_T);
    b=S.mt/BEAT;
    amp=sstep(S.mt/BEAT)*sstep((MUSIC_T-S.mt)/BEAT);
  }
  {
    const xL=240, xR=334, D=MUSIC_T, pass=(D-2)/2, t=S.mt>=0?S.mt:0;
    let x=xL, face=1, walk=0;
    if(S.mt>=0){
      if(t<pass){x=xL+(xR-xL)*eio(t/pass);walk=1}
      else if(t<pass+1){x=xR;face=Math.cos(Math.PI*(t-pass));walk=.5}
      else if(t<2*pass+1){x=xR-(xR-xL)*eio((t-pass-1)/pass);face=-1;walk=1}
      else{x=xL;face=-Math.cos(Math.PI*(t-2*pass-1));walk=.5}
    }
    walk*=amp;
    const fx=(Math.abs(face)<.08?(face<0?-.08:.08):face)*.9;
    const wp=Math.PI*b, bob=-.8*walk*Math.abs(Math.cos(wp));
    set(team,'transform',`translate(${x.toFixed(2)} ${(768+bob).toFixed(2)}) scale(${fx.toFixed(3)} .9)`);
    const la=22*walk*Math.sin(wp), oa=16*walk*Math.sin(wp);
    set(TM.fL.g,'transform',`rotate(${la.toFixed(1)} ${TM.fL.px} ${TM.fL.py})`);
    set(TM.fR.g,'transform',`rotate(${(-la).toFixed(1)} ${TM.fR.px} ${TM.fR.py})`);
    set(TM.upper,'transform',`rotate(${(6+3*walk*Math.sin(2*wp)).toFixed(1)} -41 -16)`);
    set(TM.oxR[0].g,'transform',`rotate(${oa.toFixed(1)} ${TM.oxR[0].px} ${TM.oxR[0].py})`);
    set(TM.oxL[1].g,'transform',`rotate(${oa.toFixed(1)} ${TM.oxL[1].px} ${TM.oxL[1].py})`);
    set(TM.oxL[0].g,'transform',`rotate(${(-oa).toFixed(1)} ${TM.oxL[0].px} ${TM.oxL[0].py})`);
    set(TM.oxR[1].g,'transform',`rotate(${(-oa).toFixed(1)} ${TM.oxR[1].px} ${TM.oxR[1].py})`);
    set(TM.head,'transform',`rotate(${(3*Math.sin(2*wp)*walk+2*Math.sin(ts/1400)).toFixed(1)} 34 -24)`);
    set(TM.tail,'transform',`rotate(${(12*Math.sin(ts/650)).toFixed(1)} -3 -24)`);
    TM.clods.forEach((c,i)=>{const q=((ts/520)+i/3)%1;
      set(c,'cx',(-26-9*q).toFixed(1)); set(c,'cy',(-1-7*q+10*q*q).toFixed(1)); set(c,'opacity',(walk*(1-q)).toFixed(2));});
  }
  // gall
  {
    const cr=R.cr, fl=R.flap;
    set(RP.neck,'transform',`translate(0 ${(-2.5*cr).toFixed(2)}) rotate(${(24*cr+R.nod).toFixed(1)} -2 -11)`);
    set(RP.head,'transform',`rotate(${(12*cr).toFixed(1)} -4 -22.5)`);
    set(RP.beakL,'transform',`rotate(${(-28*R.beak).toFixed(1)} -7 -21)`);
    set(RP.wing,'transform',`rotate(${(-28*fl).toFixed(1)} 0 -11)`);
    set(RP.tail,'transform',`rotate(${(-8*cr).toFixed(1)} 5 -10)`);
  }
  // llenyataire i molí
  let ca=32;
  if(S.mt>=0){
    const cb=(b/3)%1;
    ca= cb<.7 ? 32-132*eio(cb/.7) : -100+132*Math.pow((cb-.7)/.3,2);
    ca=32+(ca-32)*amp;
    const bar=Math.floor(b/3); if(bar!==lastChop&&amp>.3){lastChop=bar;sfxKnock()}
    wheelA+=dt*60*amp;
  }
  set(chopArm,'transform',`rotate(${ca.toFixed(1)} 2 -38)`);
  set(wheel,'transform',`rotate(${wheelA.toFixed(1)} 516 740)`);
  const wo=(amp*.9).toFixed(2);
  set(water,'opacity',wo); set(water2,'opacity',wo);
  drops.forEach((d,i)=>{const q=((ts/380)+i/4)%1; set(d,'cx',(529.5+(i%2?6:-4)*q).toFixed(1)); set(d,'cy',(711-6*q+14*q*q).toFixed(1)); set(d,'opacity',(amp*.9*(1-q)).toFixed(2));});
  if(amp>0.01){set(water,'stroke-dashoffset',(-ts/25%12).toFixed(1)); set(water2,'stroke-dashoffset',(-ts/18%12).toFixed(1))}

  // hores i mitges
  if(ts-lastTf>250){
    lastTf=ts;
    const h=now.getHours(),m=now.getMinutes(),s=now.getSeconds();
    if(m!==lastMin){ if(lastMin>=0&&!busy&&m!==0&&m!==30) crow(); lastMin=m; }
    if((m===0||m===30)&&s<4){
      const key=h+':'+m;
      if(key!==lastKey){ lastKey=key; const quiet=quietOn&&(h>=22||h<7); if(!quiet) show(m===0?(h%12||12):1, m===0); }
    }
  }
  requestAnimationFrame(frame);
}
{const n=new Date();if(n.getMinutes()%30===0&&n.getSeconds()<4)lastKey=n.getHours()+':'+n.getMinutes()}
requestAnimationFrame(frame);
